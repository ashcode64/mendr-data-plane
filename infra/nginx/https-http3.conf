# HTTPS + HTTP/3 (QUIC) when the OpenResty binary was built with the QUIC module.
# Installed when MENDR_HTTP3_ENABLED=true AND nginx -t succeeds (see docker-entrypoint.sh).
# Clients discover HTTP/3 via Alt-Svc.

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/acme/fallback.crt;
    ssl_certificate_key /etc/nginx/acme/fallback.key;
    ssl_protocols TLSv1.3;
    ssl_early_data on;

    # Advertise HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header QUIC-Version "1" always;

    ssl_certificate_by_lua_block {
        local ok, acme = pcall(require, "acme_ssl")
        if ok and acme and acme.ssl_certificate then
            acme.ssl_certificate()
        end
    }

    set_by_lua_block $control_plane_base {
        return os.getenv("MENDR_CONTROL_PLANE_URL") or "http://api-gateway:8090"
    }

    location = /health {
        add_header Content-Type text/plain;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        return 200 'ok';
    }

    location = /api/gateway/proxy {
        client_max_body_size 50m;
        set $target_upstream '';
        access_by_lua_file        /etc/nginx/lua/access.lua;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_connect_timeout     10s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_pass                $target_upstream;
        header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
        body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
        log_by_lua_file           /etc/nginx/lua/log.lua;
    }

    location / {
        set_by_lua_block $ingress_on {
            local flag = os.getenv("MENDR_INGRESS_ENABLED")
            if flag == "true" or flag == "1" then return "1" end
            return "0"
        }
        if ($ingress_on = 0) {
            return 404;
        }
        client_max_body_size 50m;
        limit_req zone=ingress_req burst=100 nodelay;
        limit_conn ingress_conn 40;
        set $target_upstream '';
        access_by_lua_file        /etc/nginx/lua/ingress.lua;
        proxy_http_version        1.1;
        proxy_set_header          Connection $connection_upgrade;
        proxy_set_header          Upgrade $http_upgrade;
        proxy_connect_timeout     10s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_pass                $target_upstream;
        header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
        body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
        log_by_lua_file           /etc/nginx/lua/log.lua;
    }
}
