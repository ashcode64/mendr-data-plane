# HTTPS :443 with mutual TLS (client certificate required).
# Installed when MENDR_MTLS_ENABLED=true (see docker-entrypoint.sh).
# Set MENDR_MTLS_CLIENT_CA to the PEM path of the client CA (default /etc/nginx/mtls/client-ca.crt).

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/acme/fallback.crt;
    ssl_certificate_key /etc/nginx/acme/fallback.key;

    ssl_client_certificate /etc/nginx/mtls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    set_by_lua_block $control_plane_base {
        return os.getenv("MENDR_CONTROL_PLANE_URL") or "http://api-gateway:8090"
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /api/gateway/proxy {
        client_max_body_size 50m;
        set $target_upstream '';
        access_by_lua_file        /etc/nginx/lua/access.lua;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_set_header          Upgrade $http_upgrade;
        proxy_ssl_certificate     /etc/nginx/mtls/upstream-client.crt;
        proxy_ssl_certificate_key /etc/nginx/mtls/upstream-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/mtls/upstream-ca.crt;
        proxy_ssl_verify          on;
        proxy_ssl_verify_depth    2;
        proxy_connect_timeout     10s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_pass                $target_upstream;
        header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
        body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
        log_by_lua_file           /etc/nginx/lua/log.lua;
    }

    location / {
        set_by_lua_block $ingress_on {
            local flag = os.getenv("MENDR_INGRESS_ENABLED")
            if flag == "true" or flag == "1" then return "1" end
            return "0"
        }
        if ($ingress_on = 0) {
            return 404;
        }
        client_max_body_size 50m;
        limit_req zone=ingress_req burst=100 nodelay;
        limit_conn ingress_conn 40;
        set $target_upstream '';
        access_by_lua_file        /etc/nginx/lua/ingress.lua;
        proxy_http_version        1.1;
        proxy_set_header          Connection $connection_upgrade;
        proxy_set_header          Upgrade $http_upgrade;
        proxy_ssl_certificate     /etc/nginx/mtls/upstream-client.crt;
        proxy_ssl_certificate_key /etc/nginx/mtls/upstream-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/mtls/upstream-ca.crt;
        proxy_ssl_verify          on;
        proxy_connect_timeout     10s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_pass                $target_upstream;
        header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
        body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
        log_by_lua_file           /etc/nginx/lua/log.lua;
    }
}
