# High-signal CRS-style rules always shipped with the edge image.
# For full OWASP CRS, mount the official coreruleset into /etc/nginx/waf/rules.

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(?:union\s+select|or\s+1\s*=\s*1|sleep\s*\()" \
    "id:942100,phase:2,block,msg:'SQL Injection Attack',tag:'OWASP_CRS',severity:'CRITICAL'"

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(?:<script|javascript:|onerror\s*=)" \
    "id:941100,phase:2,block,msg:'XSS Attack',tag:'OWASP_CRS',severity:'CRITICAL'"

SecRule REQUEST_URI|ARGS "@rx (?:\.\./|/etc/passwd)" \
    "id:930100,phase:2,block,msg:'Path Traversal',tag:'OWASP_CRS',severity:'CRITICAL'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:sqlmap|nikto|acunetix)" \
    "id:913100,phase:1,block,msg:'Security Scanner',tag:'OWASP_CRS',severity:'WARNING'"
