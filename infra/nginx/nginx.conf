worker_processes auto;
error_log /dev/stderr info;

# Pass container env vars into Lua (OpenResty workers).
env GATEWAY_INTERNAL_API_KEY;
env GATEWAY_EDGE_API_KEY;
env MENDR_TENANT_ID;
env MENDR_CONTROL_PLANE_URL;
env MENDR_REDIS_HOST;
env MENDR_REDIS_PORT;
env MENDR_JAVA_FALLBACK;
env MENDR_DOCKER_HOST_REWRITE;
env MENDR_FULL_RESYNC_INTERVAL_SEC;
env MENDR_INGRESS_ENABLED;
env MENDR_HOST_IDENTITY_FALLBACK;
env MENDR_INGRESS_UNDECLARED_ENFORCE;
env MENDR_TLS_REQUIRED;
env MENDR_ACME_ENABLED;
env MENDR_ACME_EMAIL;
env MENDR_ACME_DOMAINS;
env MENDR_ACME_STAGING;
env MENDR_ACME_ACCOUNT_KEY;
env MENDR_WAF_MODE;
env MENDR_WAF_CORAZA;
env MENDR_WAF_MAX_BODY_BYTES;
env MENDR_GEO_DENY;
env MENDR_GEO_ALLOW;
env MENDR_IP_DENY;
env MENDR_IP_ALLOW;
env MENDR_OTEL_ENABLED;
env MENDR_OTEL_ENDPOINT;
env MENDR_OTEL_SAMPLE_RATE;
env MENDR_HTTP3_ENABLED;
env MENDR_MTLS_ENABLED;
env MENDR_MTLS_CLIENT_CA;
env MENDR_UPSTREAM_MTLS_CERT;
env MENDR_UPSTREAM_MTLS_KEY;
env MENDR_UPSTREAM_MTLS_CA;
env MENDR_AI_DEFAULT_TPM;
env MENDR_AI_DEFAULT_RPM;
env MENDR_UPSTREAM_HTTP2;
env MENDR_BOT_MODE;
env MENDR_BOT_RPS;
env MENDR_BOT_ERROR_BURST;
env MENDR_ABUSE_RPS;
env MENDR_ACTIVE_HC;
env MENDR_BROTLI_ENABLED;
env MENDR_USAGE_METERING;
env MENDR_AI_SEMANTIC_CACHE;
env MENDR_ABUSE_RPS;
env MENDR_ACTIVE_HC;
env MENDR_ACTIVE_HC_INTERVAL_SEC;
env MENDR_BROTLI_ENABLED;
env MENDR_PII_REDACT;
env MENDR_API_KEY_FAIL_OPEN;
env VAULT_ADDR;
env VAULT_TOKEN;
env MENDR_VAULT_ADDR;
env MENDR_VAULT_TOKEN;
env MENDR_AWS_SM_PROXY;
env MENDR_GCP_SM_PROXY;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Cross-worker shared state (Phase 0 foundations)
    lua_shared_dict dedup_cache 10m;
    lua_shared_dict mendr_sync_state 1m;
    lua_shared_dict acme 16m;
    lua_shared_dict mendr_circuit_breaker 8m;
    lua_shared_dict mendr_lb_rr 2m;
    lua_shared_dict mendr_rate_limit 16m;
    lua_shared_dict mendr_response_cache 64m;
    lua_shared_dict mendr_metrics 16m;
    lua_shared_dict mendr_jwks 8m;
    # openidc caches (when lua-resty-openidc installed)
    lua_shared_dict discovery 1m;
    lua_shared_dict jwks 2m;
    lua_shared_dict mendr_splice_trie 8m;

    # Trust store for Let's Encrypt API (ACME)
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 2;

    # Ingress rate / concurrency caps (per client IP) — abuse layer
    limit_req_zone $binary_remote_addr zone=ingress_req:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=ingress_conn:10m;

    # Throughput: compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    init_by_lua_block {
        math.randomseed(ngx.now() * 1000 + ngx.worker.pid())
        local ok, acme = pcall(require, "acme_ssl")
        if ok and acme then
            acme.init()
        end
        local ok_w, waf = pcall(require, "waf")
        if ok_w and waf then
            waf.init_coraza()
        end
    }

    init_worker_by_lua_block {
        local sync_client = require("sync_client")
        sync_client.start()
        local ok, acme = pcall(require, "acme_ssl")
        if ok and acme then
            acme.init_worker()
        end
        local ok_hc, healthcheck = pcall(require, "healthcheck")
        if ok_hc and healthcheck then
            healthcheck.start()
        end
    }

    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker embedded DNS

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Named upstream for multi-instance LB + retries.
    # Keepalive enlarged for high-throughput (HTTP/1.1; gRPC uses HTTP/2 via grpc_pass).
    # Set MENDR_UPSTREAM_HTTP2=true to log readiness; true H2 upstream needs Envoy sidecar.
    upstream mendr_dynamic {
        server 0.0.0.1;  # placeholder — never used directly
        balancer_by_lua_block {
            require("peer_resolver").balance()
        }
        keepalive 128;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    # Shared ingress proxy settings (included by HTTP and HTTPS servers)
    # ── HTTP :8080 (dev / internal) + :80 (ACME HTTP-01 + optional redirect) ──
    server {
        listen 8080 reuseport;
        listen 80 reuseport;

        set_by_lua_block $control_plane_base {
            return os.getenv("MENDR_CONTROL_PLANE_URL") or "http://api-gateway:8090"
        }
        set_by_lua_block $internal_api_key {
            return os.getenv("GATEWAY_INTERNAL_API_KEY") or ""
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Prometheus scrape (Phase 5)
        location = /metrics {
            content_by_lua_block {
                local metrics = require("metrics")
                ngx.header.content_type = "text/plain; version=0.0.4"
                ngx.say(metrics.render_prometheus())
            }
        }

        # ACME HTTP-01 challenge (must be reachable on port 80 for public DNS)
        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                require("acme_ssl").serve_http_challenge()
            }
        }

        location /api/services/   { include /etc/nginx/proxy-control.conf; proxy_pass $control_plane_base; }
        location = /api/services  { include /etc/nginx/proxy-control.conf; proxy_pass $control_plane_base; }

        location /api/gateway/cors-rules {
            include /etc/nginx/proxy-control.conf;
            proxy_pass $control_plane_base;
        }

        location /api/gateway/origin-override-rules {
            include /etc/nginx/proxy-control.conf;
            proxy_pass $control_plane_base;
        }

        location /api/gateway/rate-limit-policies {
            include /etc/nginx/proxy-control.conf;
            proxy_pass $control_plane_base;
        }

        location = /api/gateway/proxy {
            client_max_body_size 50m;
            client_body_buffer_size 1m;

            set $target_upstream '';

            access_by_lua_file        /etc/nginx/lua/access.lua;
            proxy_connect_timeout     60s;
            proxy_send_timeout        300s;
            proxy_read_timeout        300s;
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_http_version        1.1;
            proxy_set_header          Connection "";
            proxy_set_header          Upgrade $http_upgrade;
            # Balancer set_timeouts() overrides per-request when using mendr_dynamic
            proxy_buffering           off;
            proxy_request_buffering   on;
            proxy_pass                $target_upstream;
            header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
            body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
            log_by_lua_file           /etc/nginx/lua/log.lua;
        }

        # gRPC passthrough (Phase 3) — requires HTTP/2 client + grpc upstream
        location /mendr.grpc/ {
            access_by_lua_file        /etc/nginx/lua/grpc_access.lua;
            grpc_pass grpc://mendr_dynamic;
            grpc_set_header X-Mendr-Gateway true;
            error_page 502 = /grpc_error;
        }

        # gRPC-Web (browser clients) — framing-aware access + grpc_pass.
        # Full text/protobuf base64 transcoding requires nginx-grpc-web or Envoy;
        # we enforce policies and forward application/grpc-web(+proto) as-is.
        location /mendr.grpc-web/ {
            access_by_lua_file        /etc/nginx/lua/grpc_access.lua;
            if ($content_type ~* "application/grpc-web-text") {
                # Text-mode grpc-web needs a transcoder; reject with clear error
                # when MENDR_GRPC_WEB_TRANSCODE is not available.
                add_header grpc-status 12 always;
                add_header grpc-message "grpc-web-text requires transcoder (set MENDR_GRPC_WEB_TRANSCODE=envoy)" always;
                return 501;
            }
            grpc_pass grpc://mendr_dynamic;
            grpc_set_header X-Mendr-Gateway true;
            grpc_set_header X-Grpc-Web true;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Headers "content-type,x-grpc-web,x-user-agent,authorization" always;
            add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
        }

        # GraphQL HTTP endpoint — transparent ingress pipeline (not Mendr envelope)
        location /graphql {
            client_max_body_size 10m;
            set $target_upstream '';
            access_by_lua_file        /etc/nginx/lua/ingress.lua;
            proxy_http_version        1.1;
            proxy_set_header          Connection "";
            proxy_connect_timeout     60s;
            proxy_send_timeout        300s;
            proxy_read_timeout        300s;
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_pass                $target_upstream;
            header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
            body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
            log_by_lua_file           /etc/nginx/lua/log.lua;
        }

        location = /grpc_error {
            internal;
            default_type application/grpc;
            add_header grpc-status 14;
            add_header grpc-message "upstream unavailable";
            return 204;
        }

        # Transparent HTTP ingress (gated). When MENDR_TLS_REQUIRED=true, non-ACME
        # traffic on this server is rejected inside ingress.lua (use :443 instead).
        location / {
            set_by_lua_block $ingress_on {
                local flag = os.getenv("MENDR_INGRESS_ENABLED")
                if flag == "true" or flag == "1" then return "1" end
                return "0"
            }
            if ($ingress_on = 0) {
                return 404;
            }

            client_max_body_size 50m;
            client_body_buffer_size 1m;

            limit_req zone=ingress_req burst=100 nodelay;
            limit_conn ingress_conn 40;

            set $target_upstream '';

            access_by_lua_file        /etc/nginx/lua/ingress.lua;
            proxy_http_version        1.1;
            proxy_set_header          Connection $connection_upgrade;
            proxy_set_header          Upgrade $http_upgrade;
            proxy_connect_timeout     60s;
            proxy_send_timeout        300s;
            proxy_read_timeout        300s;
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_buffering           off;
            proxy_pass                $target_upstream;
            header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
            body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
            log_by_lua_file           /etc/nginx/lua/log.lua;
        }
    }

    # Optional HTTPS / ACME server (:443). Enabled only when MENDR_ACME_ENABLED=true
    # via docker-entrypoint.sh installing https-acme.conf into conf.d/.
    include /etc/nginx/conf.d/*.conf;
}
