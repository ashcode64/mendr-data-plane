worker_processes auto;
error_log /dev/stderr info;

# Pass container env vars into Lua (OpenResty workers).
env GATEWAY_INTERNAL_API_KEY;
env GATEWAY_EDGE_API_KEY;
env MENDR_TENANT_ID;
env MENDR_CONTROL_PLANE_URL;
env MENDR_REDIS_HOST;
env MENDR_REDIS_PORT;
env MENDR_JAVA_FALLBACK;
env MENDR_DOCKER_HOST_REWRITE;
env MENDR_FULL_RESYNC_INTERVAL_SEC;
env MENDR_INGRESS_ENABLED;
env MENDR_HOST_IDENTITY_FALLBACK;
env MENDR_INGRESS_UNDECLARED_ENFORCE;
env MENDR_TLS_REQUIRED;
env MENDR_ACME_ENABLED;
env MENDR_ACME_EMAIL;
env MENDR_ACME_DOMAINS;
env MENDR_ACME_STAGING;
env MENDR_ACME_ACCOUNT_KEY;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict dedup_cache 10m;
    lua_shared_dict mendr_sync_state 1m;
    lua_shared_dict acme 16m;

    # Trust store for Let's Encrypt API (ACME)
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 2;

    # Ingress rate / concurrency caps (per client IP)
    limit_req_zone $binary_remote_addr zone=ingress_req:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=ingress_conn:10m;

    init_by_lua_block {
        local ok, acme = pcall(require, "acme_ssl")
        if ok and acme then
            acme.init()
        end
    }

    init_worker_by_lua_block {
        local sync_client = require("sync_client")
        sync_client.start()
        local ok, acme = pcall(require, "acme_ssl")
        if ok and acme then
            acme.init_worker()
        end
    }

    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker embedded DNS

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Shared ingress proxy settings (included by HTTP and HTTPS servers)
    # ── HTTP :8080 (dev / internal) + :80 (ACME HTTP-01 + optional redirect) ──
    server {
        listen 8080;
        listen 80;

        set_by_lua_block $control_plane_base {
            return os.getenv("MENDR_CONTROL_PLANE_URL") or "http://api-gateway:8090"
        }
        set_by_lua_block $internal_api_key {
            return os.getenv("GATEWAY_INTERNAL_API_KEY") or ""
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # ACME HTTP-01 challenge (must be reachable on port 80 for public DNS)
        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                require("acme_ssl").serve_http_challenge()
            }
        }

        location /api/services/   { include /etc/nginx/proxy-control.conf; proxy_pass $control_plane_base; }
        location = /api/services  { include /etc/nginx/proxy-control.conf; proxy_pass $control_plane_base; }

        location /api/gateway/cors-rules {
            include /etc/nginx/proxy-control.conf;
            proxy_pass $control_plane_base;
        }

        location /api/gateway/origin-override-rules {
            include /etc/nginx/proxy-control.conf;
            proxy_pass $control_plane_base;
        }

        location = /api/gateway/proxy {
            client_max_body_size 10m;
            client_body_buffer_size 1m;

            set $target_upstream '';

            access_by_lua_file        /etc/nginx/lua/access.lua;
            proxy_http_version        1.1;
            proxy_set_header          Connection "";
            proxy_connect_timeout     10s;
            proxy_send_timeout        60s;
            proxy_read_timeout        60s;
            proxy_pass                $target_upstream;
            header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
            body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
            log_by_lua_file           /etc/nginx/lua/log.lua;
        }

        # Transparent HTTP ingress (gated). When MENDR_TLS_REQUIRED=true, non-ACME
        # traffic on this server is rejected inside ingress.lua (use :443 instead).
        location / {
            set_by_lua_block $ingress_on {
                local flag = os.getenv("MENDR_INGRESS_ENABLED")
                if flag == "true" or flag == "1" then return "1" end
                return "0"
            }
            if ($ingress_on = 0) {
                return 404;
            }

            client_max_body_size 10m;
            client_body_buffer_size 1m;

            limit_req zone=ingress_req burst=100 nodelay;
            limit_conn ingress_conn 40;

            set $target_upstream '';

            access_by_lua_file        /etc/nginx/lua/ingress.lua;
            proxy_http_version        1.1;
            proxy_set_header          Connection "";
            proxy_connect_timeout     10s;
            proxy_send_timeout        60s;
            proxy_read_timeout        60s;
            proxy_pass                $target_upstream;
            header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
            body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
            log_by_lua_file           /etc/nginx/lua/log.lua;
        }
    }

    # Optional HTTPS / ACME server (:443). Enabled only when MENDR_ACME_ENABLED=true
    # via docker-entrypoint.sh installing https-acme.conf into conf.d/.
    include /etc/nginx/conf.d/*.conf;
}
