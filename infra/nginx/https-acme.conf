# HTTPS :443 with in-edge ACME (lua-resty-acme).
# Installed into /etc/nginx/conf.d/ only when MENDR_ACME_ENABLED=true
# (see docker-entrypoint.sh). Requires fallback certs under /etc/nginx/acme/.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/acme/fallback.crt;
    ssl_certificate_key /etc/nginx/acme/fallback.key;

    ssl_certificate_by_lua_block {
        require("acme_ssl").ssl_certificate()
    }

    set_by_lua_block $control_plane_base {
        return os.getenv("MENDR_CONTROL_PLANE_URL") or "http://api-gateway:8090"
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            require("acme_ssl").serve_http_challenge()
        }
    }

    location = /api/gateway/proxy {
        client_max_body_size 10m;
        client_body_buffer_size 1m;
        set $target_upstream '';
        access_by_lua_file        /etc/nginx/lua/access.lua;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_connect_timeout     10s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
        proxy_pass                $target_upstream;
        header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
        body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
        log_by_lua_file           /etc/nginx/lua/log.lua;
    }

    location / {
        set_by_lua_block $ingress_on {
            local flag = os.getenv("MENDR_INGRESS_ENABLED")
            if flag == "true" or flag == "1" then return "1" end
            return "0"
        }
        if ($ingress_on = 0) {
            return 404;
        }

        client_max_body_size 10m;
        client_body_buffer_size 1m;
        limit_req zone=ingress_req burst=100 nodelay;
        limit_conn ingress_conn 40;

        set $target_upstream '';
        access_by_lua_file        /etc/nginx/lua/ingress.lua;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_connect_timeout     10s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
        proxy_pass                $target_upstream;
        header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
        body_filter_by_lua_file   /etc/nginx/lua/body_filter.lua;
        log_by_lua_file           /etc/nginx/lua/log.lua;
    }
}
