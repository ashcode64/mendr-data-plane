services:
  mendr-gateway:
    build: ./infra/nginx
    image: mendr/data-plane:latest
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    environment:
      MENDR_CONTROL_PLANE_URL: ${MENDR_CONTROL_PLANE_URL:-https://api.mendr.io}
      MENDR_REDIS_HOST: mendr-edge-redis
      MENDR_REDIS_PORT: "6379"
      MENDR_JAVA_FALLBACK: "false"
      MENDR_DOCKER_HOST_REWRITE: ${MENDR_DOCKER_HOST_REWRITE:-host.docker.internal}
      # Per-tenant SaaS edge credential (preferred). Control plane resolves the
      # tenant from this key and scopes the route snapshot to it.
      GATEWAY_EDGE_API_KEY: ${GATEWAY_EDGE_API_KEY:-}
      MENDR_TENANT_ID: ${MENDR_TENANT_ID:-}
      # Shared internal key: backward-compat for legacy/single-tenant edges.
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      # Periodic full route-config resync backstop (seconds). 0 disables.
      MENDR_FULL_RESYNC_INTERVAL_SEC: ${MENDR_FULL_RESYNC_INTERVAL_SEC:-300}
      # Sampled TRAFFIC_OBSERVED topology edge reporting (init_v14). OFF by default; when enabled,
      # a sampled/deduped fraction of proxied calls POST the observed source->target edge (with
      # propagated trace context) to /api/internal/edge-observations on the control plane.
      MENDR_EDGE_OBSERVATION_ENABLED: ${MENDR_EDGE_OBSERVATION_ENABLED:-false}
      MENDR_EDGE_OBSERVATION_SAMPLE_RATE: ${MENDR_EDGE_OBSERVATION_SAMPLE_RATE:-1.0}
      MENDR_INGRESS_ENABLED: ${MENDR_INGRESS_ENABLED:-false}
      MENDR_TLS_REQUIRED: ${MENDR_TLS_REQUIRED:-false}
      MENDR_ACME_ENABLED: ${MENDR_ACME_ENABLED:-false}
      MENDR_ACME_EMAIL: ${MENDR_ACME_EMAIL:-}
      MENDR_ACME_DOMAINS: ${MENDR_ACME_DOMAINS:-}
      MENDR_ACME_STAGING: ${MENDR_ACME_STAGING:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./infra/nginx/proxy-control.conf:/etc/nginx/proxy-control.conf:ro
      - ./infra/nginx/lua:/etc/nginx/lua:ro
    depends_on:
      mendr-edge-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mendr-mesh

  mendr-edge-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6380:6379"
    volumes:
      - mendr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mendr-mesh

volumes:
  mendr_redis_data:

networks:
  mendr-mesh:
    name: mendr-mesh
